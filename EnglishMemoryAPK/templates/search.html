<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<title>البحث</title>
<link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="container">

<h1>🔍 نتائج البحث</h1>

<p>بحثت عن: <b>{{q}}</b></p>

{% if words %}

{% for w in words %}

<div>

<h3>{{w[0]}}</h3>

<p>🇸🇦 {{w[1]}}</p>

<a href="/delete/{{w[0]}}">
<button>🗑️ حذف</button>
</a>

<a href="/edit/{{w[0]}}">
<button>✏️ تعديل</button>
</a>

<hr>

<hr>

</div>

{% endfor %}

{% else %}

<p>❌ لم يتم العثور على أي كلمة.</p>

{% endif %}

<a href="/">
<button>🏠 العودة للرئيسية</button>
</a>

</div>

</body>
</html>
