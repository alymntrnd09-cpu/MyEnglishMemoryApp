<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<title>تعديل كلمة</title>
<link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="container">

<h1>✏️ تعديل الكلمة</h1>

<form action="/update" method="POST">

<input type="hidden" name="old_word" value="{{item[0]}}">

<input type="text"
name="word"
value="{{item[0]}}"
placeholder="الكلمة">

<input type="text"
name="meaning"
value="{{item[1]}}"
placeholder="المعنى">

<button type="submit">
💾 حفظ التعديل
</button>

</form>

<br>

<a href="/">
<button>🏠 العودة</button>
</a>

</div>

</body>

</html>
